<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kartu Terkecil</title>
<style>
:root{--bg:#071b15;--panel:#0e2a21;--panel2:#12352a;--line:#245743;--gold:#f4b83f;--text:#f5f1e7;--muted:#9db0a6;--red:#ef6262}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123d2d,#071b15 60%);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;padding:22px}.card{background:linear-gradient(145deg,#12382b,#0b251d);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 45px #0005}.center{min-height:100vh;display:grid;place-items:center;padding:20px}.home{width:min(430px,100%);padding:28px}.logo{font-size:34px;font-weight:900;letter-spacing:-1px}.sub{color:var(--muted);line-height:1.5}.input{width:100%;padding:12px 14px;border-radius:11px;background:#071b15;border:1px solid var(--line);color:white;outline:0;margin:7px 0 12px}.input:focus{border-color:var(--gold)}.btn{padding:11px 15px;border-radius:11px;font-weight:800;background:#245d45;color:white}.btn.gold{background:var(--gold);color:#10261d}.btn.red{background:#b83e45}.btn:disabled{opacity:.4;cursor:not-allowed}.divider{display:flex;align-items:center;gap:10px;color:#6f8b7d;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.roomcode{font-family:monospace;color:var(--gold);letter-spacing:3px}.grid{display:grid;grid-template-columns:1fr 290px;gap:16px}.main{padding:18px}.side{padding:16px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.player{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b241c}.player.me{border-color:var(--gold)}.small{font-size:12px;color:var(--muted)}.turn{color:var(--gold);font-weight:800}.table{min-height:240px;display:grid;place-items:center;border:1px dashed #316d53;border-radius:18px;background:#092119;margin:12px 0 18px}.pile{display:flex;gap:22px;align-items:center}.pileBox{text-align:center}.pileTitle{font-size:12px;color:var(--muted);margin-bottom:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hand{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.hand.mini{gap:4px;margin-top:6px}.hand.mini .playingCard{width:24px;height:34px;padding:2px;border-radius:6px}.hand.mini .playingCard .rank,.hand.mini .playingCard .suit,.hand.mini .playingCard .num{display:none}.hand.mini .playingCard.hidden{font-size:12px}.playingCard{width:66px;height:92px;border-radius:10px;background:#f8f4e8;color:#111;border:2px solid #d8d0bd;display:flex;flex-direction:column;justify-content:space-between;padding:7px;font-weight:900;box-shadow:0 5px 12px #0005}.playingCard.red{color:#c8313b}.playingCard.hidden{background:repeating-linear-gradient(45deg,#174d3b,#174d3b 5px,#1d6048 5px,#1d6048 10px);color:white;border-color:#2e7759;justify-content:center;align-items:center;font-size:24px}.playingCard.select{outline:3px solid var(--gold);transform:translateY(-3px)}.rank{font-size:20px}.suit{font-size:24px;text-align:center}.num{font-size:11px;text-align:right}.notice{padding:11px 13px;border-radius:12px;background:#092119;border:1px solid var(--line);margin-bottom:12px}.effect{border-color:#a77a25}.log{max-height:190px;overflow:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20}.peek{padding:22px;border-radius:18px;background:#12382b;border:1px solid var(--gold);text-align:center}.peek .playingCard{margin:12px auto}.resultRow{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line)}@media(max-width:850px){.grid{grid-template-columns:1fr}.side{order:-1}}
</style>
</head>
<body><div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let state=null, name=localStorage.ktName||'', createMode='classic';
let selected=null;
let effectSelection={own:null,targetPlayer:null,targetCard:null};
let initialPeeked=new Set();
const app=document.getElementById('app');
const sym={S:'♠',H:'♥',D:'♦',C:'♣'}; const red=new Set(['H','D']);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalizeUiText(s){
  try{return decodeURIComponent(escape(String(s)));}
  catch{return String(s);}
}
function card(c,hidden=false,select=false,on=''){
  if(hidden||!c?.rank)return `<div class="playingCard hidden ${select?'select':''}" ${on}>🂠</div>`;
  return `<div class="playingCard ${red.has(c.suit)?'red':''} ${select?'select':''}" ${on}><div class="rank">${esc(c.rank)}</div><div class="suit">${sym[c.suit]}</div><div class="num">${esc(c.rank)}</div></div>`;
}
function render(){
  if(!state) renderHome();
  else if(state.status==='lobby') renderLobby();
  else if(state.status==='initial-peek') renderInitial();
  else if(state.status==='ended') renderEnded();
  else renderGame();
  app.innerHTML=normalizeUiText(app.innerHTML);
}
function emit(event,data={},after=render){socket.emit(event,data,r=>{if(!r?.ok)alert(r?.error||'Aksi gagal');else after();});}
socket.on('state',s=>{state=s;render();});
socket.on('privatePeek',({card,duration})=>{showPeek(card,duration);});
socket.on('comparePeek',({own,opponent,duration})=>{showCompare(own,opponent,duration);});
function showPeek(c,d=2000){const sec=Math.round(d/1000);const el=document.createElement('div');el.className='modal';el.innerHTML=normalizeUiText(`<div class="peek"><div class="small">Kartu yang kamu lihat</div>${card(c)}<div class="small">Tutup dalam ${sec} detik. Ingat posisinya.</div></div>`);document.body.appendChild(el);setTimeout(()=>el.remove(),d);}
function showCompare(a,b,d=2000){const el=document.createElement('div');el.className='modal';el.innerHTML=normalizeUiText(`<div class="peek"><div class="small">Perbandingan · lihat selama 2 detik</div><div style="display:flex;gap:18px;justify-content:center"><div>${card(a)}<div class="small">Kamu</div></div><div>${card(b)}<div class="small">Lawan</div></div></div></div>`);document.body.appendChild(el);setTimeout(()=>el.remove(),d);}
function renderHome(){app.innerHTML=`<div class="center"><div class="card home"><div class="logo">Interface Game</div><p class="sub">Kumpulkan total nilai kartu sekecil mungkin. Ingat 2 kartu awal, gunakan efek kartu, dan pasang kartu dengan nilai sama ke tumpukan buang.</p><label class="small">Nama</label><input id="name" class="input" maxlength="20" placeholder="Nama kamu" value="${esc(name)}"><div class="small">Mode</div><div class="actions" style="margin:7px 0 12px"><button id="classicMode" class="btn ${createMode==='classic'?'gold':''}" onclick="setMode('classic')">Classic 4-15</button><button id="duelMode" class="btn ${createMode==='duel'?'gold':''}" onclick="setMode('duel')">1v1 Duel</button></div><button class="btn gold" style="width:100%" onclick="create()">Buat Room</button><div class="divider">atau</div><input id="code" class="input" maxlength="5" placeholder="KODE ROOM" style="text-align:center;letter-spacing:4px;text-transform:uppercase"><button class="btn" style="width:100%" onclick="join()">Gabung Room</button><p class="small" style="margin-top:14px">Classic 4-15 pemain. 1v1 tepat 2 pemain. Untuk 13-15 pemain digunakan 2 deck tanpa joker.</p></div></div>`;}
function setMode(m){createMode=m;render();}
function getName(){name=document.getElementById('name').value.trim();localStorage.ktName=name;return name;}
function create(){const n=getName();if(!n)return alert('Masukkan nama.');emit('createRoom',{name:n,mode:createMode});}
function join(){const n=getName(),code=document.getElementById('code').value.trim().toUpperCase();if(!n||!code)return alert('Isi nama dan kode room.');emit('joinRoom',{name:n,code});}
function renderLobby(){const host=state.hostId===state.me.id;app.innerHTML=`<div class="app"><header><div><div class="logo" style="font-size:25px">Interface Game</div><div class="small">Room <span class="roomcode">${state.code}</span> · ${state.mode==='duel'?'1v1 Duel':'Classic 4-15'}</div></div><button class="btn" onclick="location.reload()">Keluar</button></header><div class="card main"><div class="notice"><b>${state.players.length}/${state.mode==='duel'?2:15} pemain</b><div class="small">Urutan join menentukan arah giliran.</div></div><div class="players">${state.players.map((p,i)=>`<div class="player ${p.id===state.me.id?'me':''}"><b>${i+1}. ${esc(p.name)}</b>${p.id===state.hostId?' <span class="turn">HOST</span>':''}<div class="small">${p.connected?'Terhubung':'Terputus'}</div></div>`).join('')}</div><div style="margin-top:18px;text-align:center">${host?`<button class="btn gold" ${(state.mode==='duel'?state.players.length!==2:state.players.length<4)?'disabled':''} onclick="emit('startGame')">Mulai Game</button>`:'<div class="small">Menunggu host memulai...</div>'}</div></div></div>`;}
function myPlayer(){return state.players.find(p=>p.id===state.me.id);}
function isMyTurn(){return state.players[state.turnIndex]?.id===state.me.id;}
function renderInitial(){const me=myPlayer();app.innerHTML=`<div class="center"><div class="card home" style="width:min(760px,100%)"><div class="logo">2 Kartu Awal</div><p class="sub">Semua 4 kartu tertutup. Kamu hanya boleh membuka tepat 2 kartu. Kartu yang dibuka terlihat selama 3 detik, lalu kembali tertutup. <b>Ingat posisi dan nilainya.</b></p><div class="hand" style="justify-content:center">${me.hand.map((c,i)=>card(c,!c.rank,initialPeeked.has(c.id),`onclick="peekInitial('${c.id}')"`)).join('')}</div><div style="text-align:center;margin-top:18px"><b>${initialPeeked.size}/2 kartu sudah dilihat</b><br><button class="btn gold" style="margin-top:10px" ${initialPeeked.size!==2?'disabled':''} onclick="emit('initialReady',{},()=>{initialPeeked=new Set();render();})">Saya sudah ingat 2 kartu</button><div class="small" style="margin-top:9px">Pemain siap: ${state.players.filter(p=>p.initialReady).length}/${state.players.length}</div></div></div></div>`;}
function peekInitial(id){if(initialPeeked.size>=2||initialPeeked.has(id))return;socket.emit('initialPeek',{cardId:id},r=>{if(!r?.ok)alert(r?.error||'Tidak bisa melihat kartu.');else{initialPeeked.add(id);render();}});}
function renderGame(){const me=myPlayer(),turn=state.players[state.turnIndex],top=state.discard.at(-1),drawn=state.drawn?.playerId===me.id?state.drawn.card:null,effect=state.effect?.playerId===me.id?state.effect.type:null;const canMatch=!!top;app.innerHTML=`<div class="app"><header><div><div class="logo" style="font-size:25px">Kartu Terkecil</div><div class="small">Room <span class="roomcode">${state.code}</span> · ${state.players.length} pemain</div></div><div class="turn">${state.status==='final-round'?'RONDE TERAKHIR':`Giliran: ${esc(turn?.name||'-')}`}</div></header><div class="grid"><main class="card main"><div class="notice">${state.status==='final-round'?`<b>${esc(state.players.find(p=>p.id===state.caller)?.name||'Pemain')} menyatakan SELESAI.</b> Semua pemain lain mendapat tepat 1 giliran terakhir.`:`Giliranmu mengambil tepat 1 kartu dari dek tengah. Setelah kartu dibuang, siapa pun boleh memasang kartu dengan nilai/rank yang sama.`}</div><div class="table"><div class="pile"><div class="pileBox"><div class="pileTitle">DEK TENGAH · ${state.deckCount}</div><div class="playingCard hidden ${isMyTurn()&&state.turnStage==='awaiting-draw'?'select':''}" onclick="${isMyTurn()&&state.turnStage==='awaiting-draw'?'drawDeck()':''}">🂠</div></div><div class="pileBox"><div class="pileTitle">TUMPUKAN BUANG · ${state.discard.length}</div>${top?card(top):'<div class="small">Belum ada buangan</div>'}</div></div></div>${drawn?`<div class="notice effect"><b>Kartu yang diambil:</b><div class="hand">${card(drawn)}</div><div class="small">Pilih: simpan dengan menukar salah satu kartu tangan, buang kartu ini, atau gunakan efek khusus jika 7/8/9/10/J/Q/K hitam.</div><div class="actions" style="margin-top:10px"><button class="btn" ${!selected?'disabled':''} onclick="swapDrawn()">Tukar dengan kartu #${selected?me.hand.findIndex(c=>c.id===selected)+1:'?'}</button>${effectForClient(drawn)?`<button class="btn gold" onclick="useEffect()">Gunakan Efek</button>`:''}<button class="btn" onclick="emit('discardDrawn')">Buang Kartu Ini</button></div></div>`:''}${effect?renderEffect(effect):''}<div><b>Kartu kamu · ${me.handCount}</b><div class="small">Kartu tetap tertutup di layar. Kamu harus mengingat kartu yang pernah kamu lihat.</div><div class="hand">${me.hand.map((c,i)=>card(c,!c.rank,selected===c.id,`onclick="selectCard('${c.id}')"`)).join('')}</div></div><div class="actions" style="margin-top:14px">${canMatch&&selected?`<button class="btn gold" onclick="matchSelected()">Pasang kartu #${me.hand.findIndex(c=>c.id===selected)+1} ke buangan</button>`:''}${state.status==='playing'?`<button class="btn red" onclick="emit('declareFinish')">Deklarasi "Selesai"</button>`:''}</div></main><aside class="card side"><b>Pemain</b><div class="players" style="grid-template-columns:1fr;margin-top:9px">${state.players.map((p,i)=>`<div class="player ${p.id===turn?.id?'me':''}"><b>${i+1}. ${esc(p.name)}</b><div class="small">${p.handCount} kartu ${p.id===turn?.id?'· giliran':''}</div>${p.id!==me.id?`<div class="hand mini">${Array.from({length:p.handCount},()=>card(null,true)).join('')}</div>`:''}</div>`).join('')}</div><hr style="border-color:var(--line);margin:15px 0"><b>Log</b><div class="log" style="margin-top:8px">${state.log.slice().reverse().map(x=>`<div>${esc(x)}</div>`).join('')}</div></aside></div></div>`;}
function drawDeck(){emit('draw',{source:'deck'});}
function selectCard(id){selected=selected===id?null:id;render();}
function swapDrawn(){if(!selected)return alert('Pilih satu kartu tangan untuk ditukar.');emit('swapDrawn',{handCardId:selected},()=>{selected=null;});}
function matchSelected(){if(!selected)return;emit('matchDiscard',{cardId:selected},()=>{selected=null;});}
function effectForClient(c){if(!c)return null;if(['7','8'].includes(c.rank))return'peek-own';if(['9','10'].includes(c.rank))return'peek-opponent';if(c.rank==='J')return'blind-swap';if(c.rank==='Q'||(c.rank==='K'&&!red.has(c.suit)))return'compare-swap';return null;}
function useEffect(){emit('useEffect',{},()=>{selected=null;});}
function renderEffect(type){const me=myPlayer(),others=state.players.filter(p=>p.id!==me.id);if(type==='peek-own')return `<div class="notice effect"><b>7 / 8 â€” lihat tepat 1 kartu sendiri yang belum diketahui.</b><div class="small">Pilih satu posisi kartu. Setelah melihat 2 detik, efek langsung selesai.</div><div class="actions" style="margin-top:8px">${me.hand.map((c,i)=>`<button class="btn" onclick="peekOwn('${c.id}')">Kartu #${i+1}</button>`).join('')}</div></div>`;if(type==='peek-opponent')return `<div class="notice effect"><b>9 / 10 â€” lihat tepat 1 kartu lawan.</b><div class="small">Pilih satu pemain dan satu posisi kartu. Setelah melihat 2 detik, efek langsung selesai.</div>${others.map(p=>`<div style="margin-top:8px"><b>${esc(p.name)}</b><div class="actions">${p.hand.map((c,i)=>`<button class="btn" onclick="peekOpponent('${p.id}','${c.id}')">#${i+1}</button>`).join('')}</div></div>`).join('')}</div>`;if(type==='blind-swap')return `<div class="notice effect"><b>J â€” tukar 1 kartu dengan kartu lawan secara tertutup.</b><div class="small">Pilih posisi kartumu dan posisi kartu lawan. Tidak ada kartu yang dibuka.</div><div class="actions" style="margin-top:8px">${me.hand.map((c,i)=>`<button class="btn ${effectSelection.own===c.id?'gold':''}" onclick="effectSelection.own='${c.id}';render()">Kamu #${i+1}</button>`).join('')}</div>${others.map(p=>`<div style="margin-top:8px"><b>${esc(p.name)}</b><div class="actions">${p.hand.map((c,i)=>`<button class="btn ${effectSelection.targetPlayer===p.id&&effectSelection.targetCard===c.id?'gold':''}" onclick="effectSelection.targetPlayer='${p.id}';effectSelection.targetCard='${c.id}';render()">#${i+1}</button>`).join('')}</div></div>`).join('')}<button class="btn gold" style="margin-top:10px" onclick="blindSwap()">Tukar Tertutup</button></div>`;return `<div class="notice effect"><b>Q / K hitam â€” lihat + bandingkan.</b><div class="small">Pilih satu kartumu dan satu kartu lawan. Keduanya terlihat 2 detik, lalu kamu memilih tukar atau tidak.</div><div class="actions" style="margin-top:8px">${me.hand.map((c,i)=>`<button class="btn ${effectSelection.own===c.id?'gold':''}" onclick="effectSelection.own='${c.id}';render()">Kamu #${i+1}</button>`).join('')}</div>${others.map(p=>`<div style="margin-top:8px"><b>${esc(p.name)}</b><div class="actions">${p.hand.map((c,i)=>`<button class="btn ${effectSelection.targetPlayer===p.id&&effectSelection.targetCard===c.id?'gold':''}" onclick="effectSelection.targetPlayer='${p.id}';effectSelection.targetCard='${c.id}';render()">#${i+1}</button>`).join('')}</div></div>`).join('')}<button class="btn gold" style="margin-top:10px" onclick="compare()">Bandingkan</button></div>`;}
function peekOwn(id){emit('peekOwn',{cardId:id});}
function peekOpponent(pid,cid){emit('peekOpponent',{playerId:pid,cardId:cid});}
function blindSwap(){if(!effectSelection.own||!effectSelection.targetPlayer||!effectSelection.targetCard)return alert('Pilih lengkap.');emit('blindSwap',effectSelection,()=>{effectSelection={own:null,targetPlayer:null,targetCard:null};});}
function compare(){if(!effectSelection.own||!effectSelection.targetPlayer||!effectSelection.targetCard)return alert('Pilih lengkap.');const sel={...effectSelection};socket.emit('comparePeek',{ownCardId:sel.own,targetPlayerId:sel.targetPlayer,targetCardId:sel.targetCard},r=>{if(!r?.ok)return alert(r?.error||'Tidak bisa membandingkan.');setTimeout(()=>{const swap=confirm('Tukar kedua kartu?\nOK = Tukar\nCancel = Jangan tukar');socket.emit('compareSwap',{swap},r2=>{if(!r2?.ok)alert(r2?.error||'Aksi gagal.');effectSelection={own:null,targetPlayer:null,targetCard:null};render();});},2100);});}
function renderEnded(){const rows=state.players.map(p=>({p,score:p.hand.reduce((s,c)=>s+(c.rank==='K'&&!red.has(c.suit)?13:c.rank==='K'?-2:c.rank==='A'?1:c.rank==='J'?11:c.rank==='Q'?12:Number(c.rank)),0)})).sort((a,b)=>a.score-b.score);app.innerHTML=`<div class="center"><div class="card home" style="width:min(900px,100%)"><div class="logo">ðŸ† ${esc(rows[0]?.p.name||'')} Menang!</div><p class="sub">Semua kartu dibuka. Skor terkecil menang.</p>${rows.map((r,i)=>`<div class="resultRow"><b>#${i+1} ${esc(r.p.name)}</b><b>${r.score}</b></div><div class="hand">${r.p.hand.map(c=>card(c)).join('')}</div>`).join('')}<button class="btn" style="margin-top:18px" onclick="location.reload()">Kembali</button></div></div>`;}
render();
</script>
</body>
</html>
